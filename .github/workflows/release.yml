name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish using this workflow revision (optional when running on a tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: yomu-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        name: Compute and validate the checked-out release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] && [ -z "$REQUESTED_TAG" ]; then
            echo '::error::Select a tag or supply release_tag for a manual release.'
            exit 1
          fi
          export GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_REF="refs/tags/$RELEASE_TAG"
          bash gradlew --no-daemon writeReleaseMetadata
          node scripts/release.cjs version
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      MAVEN_URL: ${{ vars.ARTIFACT_KEEPER_RELEASE_URL || 'https://artifact.sumirelabs.com/maven/releases' }}
    steps:
      - name: Check Maven credentials
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        run: |
          if [ -z "$MAVEN_USER" ] || [ -z "$MAVEN_PASSWORD" ]; then
            echo '::error::Repository secrets MAVEN_USER and MAVEN_PASS must both be available.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both Maven publications locally
        run: |
          export GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_REF="refs/tags/$RELEASE_TAG"
          bash gradlew --no-daemon \
            :publishMavenJavaPublicationToReleaseStagingRepository \
            :mapper:publishMavenJavaPublicationToReleaseStagingRepository \
            writeReleaseMetadata
      - name: Check publication metadata and select release assets
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/release.cjs prepare
      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-${{ env.RELEASE_VERSION }}
          path: build/release-assets/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
      - name: Check for an existing Maven publication
        id: maven
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        run: node scripts/release.cjs check
      - name: Publish core and mapper to Artifact Keeper
        if: steps.maven.outputs.published != 'true'
        env:
          ORG_GRADLE_PROJECT_sumireMavenUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_sumireMavenPassword: ${{ secrets.MAVEN_PASS }}
        run: |
          export GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_REF="refs/tags/$RELEASE_TAG"
          bash gradlew --no-daemon \
            :publishMavenJavaPublicationToSumireMavenRepository \
            :mapper:publishMavenJavaPublicationToSumireMavenRepository \
            -PmavenUrl="$MAVEN_URL"
      - name: Verify uploaded Maven files
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        run: |
          node scripts/release.cjs check > build/maven-verification.txt
          cat build/maven-verification.txt
          grep -q 'Identical Maven publication already exists' build/maven-verification.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(build/release-assets/"$RELEASE_VERSION"/*)
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # A successful Maven upload can be retried without republishing identical files.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > build/release-is-draft.txt; then
            if [ "$(cat build/release-is-draft.txt)" != true ]; then
              echo 'This GitHub Release is already published; leaving it unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Yomu $RELEASE_VERSION" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
